function renderSteps(p) {
  const panel = document.getElementById('panel-' + p);
  panel.innerHTML = steps[p].map((s, i) => {
    let h = `<div class="step${i===0?' open':''}" id="step-${p}-${i}"><div class="step-head" onclick="toggleStep('${p}-${i}')"><div class="num">${i+1}</div><div class="st">${s.t}</div><div class="toggle-icon">▶</div></div><div class="step-content">`;
    if (s.d) h += `<div class="desc">${s.d}</div>`;
    if (s.c) h += `<div class="cmd">${s.c}<button class="copy">复制</button></div>`;
    if (s.c2d) h += `<div class="desc" style="margin-top:8px">${s.c2d}</div>`;
    if (s.c2) h += `<div class="cmd">${s.c2}<button class="copy">复制</button></div>`;
    if (s.d2) h += `<div class="desc" style="margin-top:8px">${s.d2}</div>`;
    if (s.ok) h += `<div class="ok-box">${s.ok}</div>`;
    if (s.tip) h += `<div class="tip">${s.tip}</div>`;
    if (s.tr) s.tr.forEach(t => h += `<div class="trouble">❌ ${t}</div>`);
    h += `</div></div>`;
    return h;
  }).join('');
  panel.querySelectorAll('.cmd .copy').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      navigator.clipboard.writeText(btn.parentNode.childNodes[0].textContent.trim()).then(() => {
        const o = btn.textContent; btn.textContent = '✓ 已复制'; setTimeout(() => btn.textContent = o, 1500);
      });
    });
  });
}
function toggleStep(id) { document.getElementById('step-' + id).classList.toggle('open'); }

  const sh = document.querySelector('.sticky-head');
  const secHead = document.getElementById('secHead');
  if (sh && secHead) secHead.style.top = sh.offsetHeight + 'px';
}

fixSecHead();
function downloadPackage() {
  try {
    const bin = atob(PKG_B64); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], {type:'application/zip'}); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = '多平台下载工具包_v2.3.0_261012.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    const btn = document.getElementById('pkgBtn');
    btn.textContent = '✓ 下载已触发，检查浏览器下载列表';
    setTimeout(() => btn.textContent = '⬇️ 下载工具包', 3000);
  } catch(e) { alert('下载失败: ' + e.message); }
}
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('show');
  });
});
document.getElementById('faq-container').innerHTML = faqs.map(f =>
  `<div class="faq-item"><div class="q">${f.q}</div><div class="a">${f.a}</div><span class="where">解决后回到：${f.w}</span></div>`
).join('');
renderSteps('mac');
renderSteps('win');
</script>
